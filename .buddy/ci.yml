- pipeline: ci
  name: CI
  refs:
  - refs/heads/*
  events:
  - type: PUSH
  actions:
  - action: Linting
    type: BUILD
    docker_image_name: library/python
    docker_image_tag: 3.13
    execute_commands:
    - python -m venv venv
    - source venv/bin/activate
    - "pip install -e '.[dev]'"
    - make format args='--check'
    cached_dirs:
    - /root/.cache/pip
    shell: BASH
  - action: Python 3.10.x - Tests
    type: BUILD
    docker_image_name: library/python
    docker_image_tag: 3.10.18
    execute_commands:
    - "# Set Firefox environment variables to help with headless operation"
    - Xvfb :99 -screen 0 1280x1024x24 &
    - export DISPLAY=:99.0
    - export MOZ_HEADLESS=1
    - export MOZ_NO_REMOTE=1
    - "export PATH=${HOME}/firefox-latest-smartcar/firefox:$PATH"
    - firefox --version
    - firefox -headless &
    - ""
    - "# Run Tests"
    - python -m venv venv
    - source venv/bin/activate
    - "pip install -e '.[dev]'"
    - ""
    - make test
    - ""
    setup_commands:
    - apt-get update
    - apt-get install -y \
    - '  libgtk-3-0 \'
    - '  libasound2 \'
    - '  libdbus-glib-1-2 \'
    - '  libx11-xcb1 \'
    - '  libxt6 \'
    - '  libnss3 \'
    - '  libxtst6 \'
    - '  libxss1 \'
    - '  libpci3 \'
    - '  libatk1.0-0 \'
    - '  libatk-bridge2.0-0 \'
    - '  libcups2 \'
    - '  libdrm2 \'
    - '  libxcomposite1 \'
    - '  libxdamage1 \'
    - '  libxfixes3 \'
    - '  libxkbcommon0 \'
    - '  libxrandr2 \'
    - '  xvfb'
    - ""
    - ""
    - "# Download the latest Firefox"
    - wget -O /tmp/firefox-latest.tar.xz 'https://download.mozilla.org/?product=firefox-latest&lang=en-US&os=linux64'
    - "mkdir -p ${HOME}/firefox-latest-smartcar"
    - "tar -xJf /tmp/firefox-latest.tar.xz -C ${HOME}/firefox-latest-smartcar"
    - rm /tmp/firefox-latest.tar.xz
    cached_dirs:
    - /root/.cache/pip
    shell: BASH
