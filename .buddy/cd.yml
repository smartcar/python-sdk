- pipeline: cd
  name: CD
  refs:
    - refs/heads/master
  events:
    - type: PUSH
  fail_on_prepare_env_warning: true
  description_required: true
  variables:
    - key: GH_TOKEN
      value: $GH_TOKEN_PUBLIC_PACKAGES
  actions:
    - action: Semantic Release
      type: BUILD
      docker_image_name: library/node
      docker_image_tag: 18.20.8
      execute_commands:
        - npm install semantic-release@20.x.x semantic-release-replace-plugin@1.x.x
        - npx semantic-release
      cached_dirs:
        - /root/.cache/pip
      shell: BASH
    - action: Publish to PyPI
      type: BUILD
      disabled: true
      docker_image_name: library/python
      docker_image_tag: 3.13
      execute_commands:
        - pip install build twine
        - python -m build
        - twine upload dist/* -u __token__ -p $PYPI_PASSWORD
      cached_dirs:
        - /root/.cache/pip
      shell: BASH
